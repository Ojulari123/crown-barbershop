name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crown_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: Backend
    env:
      # CI-only throwaway values; nothing here is a real secret.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crown_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crown_test
      JWT_SECRET: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrate an empty database
        run: python migrate.py up && python migrate.py verify
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      # The build does not call the API (site pages render on request).
      - run: npm run build
